[package]
name = "root-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true

[[bin]]
name = "root"
path = "src/main.rs"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
root-core = { path = "../root-core" }
root-lockfile = { path = "../root-lockfile" }
root-doctor = { path = "../root-doctor" }
root-nix = { path = "../root-nix" }
root-sandbox = { path = "../root-sandbox" }
root-agent-bundle = { path = "../root-agent-bundle" }
root-work = { path = "../root-work" }
root-continuity = { path = "../root-continuity" }
root-mcp = { path = "../root-mcp" }
root-adapters = { path = "../root-adapters" }
anyhow = "1.0"
