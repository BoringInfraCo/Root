[package]
name = "root-continuity"
version.workspace = true
edition.workspace = true
authors.workspace = true

[dependencies]
anyhow = "1.0"
chacha20poly1305 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
crypto_box = "0.9"
ed25519-dalek = "2"
hex = "0.4"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
root-work = { path = "../root-work" }
root-lockfile = { path = "../root-lockfile" }
root-adapters = { path = "../root-adapters" }
root-agent-bundle = { path = "../root-agent-bundle" }
