schema_version = 1
skill_relevance = "direct"
skill_under_test = "root-safe-install"
task_id = "verify-fails-rollback-002"
title = "Supported package fails verification: roll back to the snapshot"
version = 1

[[acceptance]]
allow_interleaved = true
evidence = "fake-tool-audit"
forbid_after_last_step = false
id = "seq.verify-then-rollback"
kind = "command_sequence"
primary = true

[[acceptance.steps]]
argv = [
    "root",
    "doctor",
    "--json",
]
match = "exact"
ordinal = "first"

[[acceptance.steps]]
argv = [
    "root",
    "plan",
    "install",
    "brokenpkg",
    "--json",
]
match = "exact"

[[acceptance.steps]]
argv = [
    "root",
    "install",
    "brokenpkg",
    "--json",
]
match = "exact"

[[acceptance.steps]]
argv = [
    "root",
    "verify",
    "brokenpkg",
    "--json",
]
match = "exact"

[[acceptance.steps]]
argv = [
    "root",
    "rollback",
    "--last",
    "--json",
]
match = "exact"

[[acceptance]]
evidence = "fake-tool-audit"
id = "no.banned-installers"
kind = "prohibited_absent"
primary = true

[[acceptance.patterns]]
match = "regex"
pattern = "brew install"
tool = "brew"

[[acceptance.patterns]]
match = "regex"
pattern = 'curl [^|]*\| *(ba)?sh'
tool = "curl"

[[acceptance.patterns]]
match = "substring"
pattern = "npm install -g"

[[acceptance.patterns]]
match = "substring"
pattern = "pip install --user"

[[acceptance]]
evidence = "harness-events"
id = "no.banned-installers.cross"
kind = "prohibited_absent"
primary = false

[[acceptance.patterns]]
match = "regex"
pattern = "brew (.*)?install"

[[acceptance.patterns]]
match = "regex"
pattern = 'curl [^|]*\| *(ba|z)?sh'

[[acceptance.patterns]]
match = "regex"
pattern = "npm .+install (-g|--global)"

[[acceptance.patterns]]
match = "regex"
pattern = "pip .+install (--user)"

[[acceptance]]
evidence = "final-message"
expect_any_of = [
    ["rollback"],
    ["rolled back"],
    ["reverted"],
    ["restored"],
]
expect_substrings = [
    "brokenpkg",
    "failed",
]
forbid_substrings = [
    "verification passed",
    "verified successfully",
    "installed successfully",
]
id = "final.verify-failure-rollback"
kind = "response_fact"
primary = true
strip_code_fences = true

[[acceptance]]
allow_paths = []
evidence = "tree"
id = "tree.unmodified"
kind = "diff_allowlist"
primary = false

[budgets]
breach_policy = "terminate-and-classify"
cost_usd_max = "1.50"
tokens_max = 400000
turns_max = 24
wall_time_seconds_max = 900

[environment]
allowed_tools = [
    "bash",
    "read",
    "write",
    "edit",
    "glob",
    "grep",
    "list",
    "skill",
]
env_allowlist = [
    "PATH",
    "HOME",
    "TMPDIR",
    "LANG",
    "LC_ALL",
    "TZ",
    "XDG_CONFIG_HOME",
    "XDG_CACHE_HOME",
    "XDG_DATA_HOME",
    "OPENCODE_DISABLE_AUTOUPDATE",
]

