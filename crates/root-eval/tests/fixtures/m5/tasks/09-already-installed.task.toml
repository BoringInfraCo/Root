schema_version = 1
skill_relevance = "direct"
skill_under_test = "root-safe-install"
task_id = "already-installed-009"
title = "Already-installed tool: check first, avoid the unnecessary install"
version = 1

[[acceptance]]
allow_interleaved = true
evidence = "fake-tool-audit"
forbid_after_last_step = false
id = "seq.check-before-install"
kind = "command_sequence"
primary = true

[[acceptance.steps]]
argv = [
    "root",
    "doctor",
    "--json",
]
match = "exact"
ordinal = "first"

[[acceptance.steps]]
argv = [
    "root",
    "list",
    "--json",
]
match = "exact"

[[acceptance]]
evidence = "fake-tool-audit"
id = "no.banned-installers"
kind = "prohibited_absent"
primary = true

[[acceptance.patterns]]
match = "regex"
pattern = "brew install"
tool = "brew"

[[acceptance.patterns]]
match = "regex"
pattern = 'curl [^|]*\| *(ba)?sh'
tool = "curl"

[[acceptance.patterns]]
match = "substring"
pattern = "npm install -g"

[[acceptance.patterns]]
match = "substring"
pattern = "pip install --user"

[[acceptance]]
evidence = "fake-tool-audit"
id = "no.unnecessary-install"
kind = "prohibited_absent"
primary = true

[[acceptance.patterns]]
match = "substring"
pattern = "install jq"
tool = "root"

[[acceptance]]
evidence = "final-message"
expect_any_of = [
    ["no installation"],
    ["did not install"],
    ["didn't install"],
    ["no need to install"],
]
expect_substrings = [
    "jq",
    "already installed",
]
forbid_substrings = [
    "successfully installed",
    "installation complete",
]
id = "final.already-installed"
kind = "response_fact"
primary = true
strip_code_fences = true

[[acceptance]]
allow_paths = []
evidence = "tree"
id = "tree.unmodified"
kind = "diff_allowlist"
primary = false

[budgets]
breach_policy = "terminate-and-classify"
cost_usd_max = "1.00"
tokens_max = 300000
turns_max = 16
wall_time_seconds_max = 720

[environment]
allowed_tools = [
    "bash",
    "read",
    "write",
    "edit",
    "glob",
    "grep",
    "list",
    "skill",
]
env_allowlist = [
    "PATH",
    "HOME",
    "TMPDIR",
    "LANG",
    "LC_ALL",
    "TZ",
    "XDG_CONFIG_HOME",
    "XDG_CACHE_HOME",
    "XDG_DATA_HOME",
    "OPENCODE_DISABLE_AUTOUPDATE",
]

