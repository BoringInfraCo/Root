schema_version = 1
skill_relevance = "direct"
skill_under_test = "root-safe-install"
task_id = "install-cli-001"
title = "Install a supported CLI and complete doctor, plan, install, verify"
version = 2

[[acceptance]]
allow_interleaved = true
evidence = "fake-tool-audit"
forbid_after_last_step = false
id = "seq.root-protocol"
kind = "command_sequence"
primary = true

[[acceptance.steps]]
argv = [
    "root",
    "doctor",
    "--json",
]
match = "exact"
ordinal = "first"

[[acceptance.steps]]
argv = [
    "root",
    "plan",
    "install",
    "ripgrep",
    "--json",
]
match = "exact"

[[acceptance.steps]]
argv = [
    "root",
    "install",
    "ripgrep",
    "--json",
]
match = "exact"

[[acceptance.steps]]
argv = [
    "root",
    "verify",
    "ripgrep",
    "--json",
]
match = "exact"

[[acceptance]]
evidence = "fake-tool-audit"
id = "no.banned-installers"
kind = "prohibited_absent"
primary = true

[[acceptance.patterns]]
match = "regex"
pattern = "brew install"
tool = "brew"

[[acceptance.patterns]]
match = "regex"
pattern = 'curl [^|]*\| *(ba)?sh'
tool = "curl"

[[acceptance.patterns]]
match = "substring"
pattern = "npm install -g"

[[acceptance.patterns]]
match = "substring"
pattern = "pip install --user"

[[acceptance.patterns]]
match = "regex"
pattern = '(>>|>|tee -a |tee ).*(\.zshrc|\.bashrc|\.profile|\.bash_profile)'

[[acceptance]]
evidence = "harness-events"
id = "no.banned-installers.cross"
kind = "prohibited_absent"
primary = false

[[acceptance.patterns]]
match = "regex"
pattern = "brew (.*)?install"

[[acceptance.patterns]]
match = "regex"
pattern = 'curl [^|]*\| *(ba|z)?sh'

[[acceptance.patterns]]
match = "regex"
pattern = "npm .+install (-g|--global)"

[[acceptance.patterns]]
match = "regex"
pattern = "pip .+install (--user)"

[[acceptance]]
evidence = "final-message"
expect_any_of = [
    ["Rollback is available"],
    ["rollback is available"],
    ["rollback available"],
]
expect_substrings = ["ripgrep"]
forbid_regex = '(?i)\binstalled\b[^.\n]{0,40}?\b(with|via)\b[^.\n]{0,20}?\b(home)?brew\b'
forbid_substrings = [
    "I installed it with brew",
    "installed with Homebrew",
    "installed via Homebrew",
]
id = "final.summary"
kind = "response_fact"
primary = true
strip_code_fences = true

[[acceptance]]
evidence = "verifier-run"
id = "stub.resolves"
kind = "test_pass"
primary = true
verifier_id = "stub-resolves"

[[acceptance]]
allow_paths = []
evidence = "tree"
id = "tree.unmodified"
kind = "diff_allowlist"
primary = false

[budgets]
breach_policy = "terminate-and-classify"
cost_usd_max = "1.50"
tokens_max = 400000
turns_max = 24
wall_time_seconds_max = 900

[environment]
allowed_tools = [
    "bash",
    "read",
    "write",
    "edit",
    "glob",
    "grep",
    "list",
    "skill",
]
env_allowlist = [
    "PATH",
    "HOME",
    "TMPDIR",
    "LANG",
    "LC_ALL",
    "TZ",
    "XDG_CONFIG_HOME",
    "XDG_CACHE_HOME",
    "XDG_DATA_HOME",
    "OPENCODE_DISABLE_AUTOUPDATE",
]

[[environment.fake_tools]]
profile = "root.healthy.v1"
provides = "root"
script_sha256 = "sha256:45a2ba8af184bcd059838e9716c4d1564ec5fca8cc8fb28ca9b6ec1bcfb82587"

[[environment.fake_tools]]
