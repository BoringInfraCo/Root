schema_version = 1
skill_relevance = "direct"
skill_under_test = "root-safe-install"
task_id = "runtime-install-008"
title = "Runtime install: exact doctor-first sequence and honest summary"
version = 1

[[acceptance]]
allow_interleaved = true
evidence = "fake-tool-audit"
forbid_after_last_step = false
id = "seq.root-protocol"
kind = "command_sequence"
primary = true

[[acceptance.steps]]
argv = [
    "root",
    "doctor",
    "--json",
]
match = "exact"
ordinal = "first"

[[acceptance.steps]]
argv = [
    "root",
    "plan",
    "install",
    "nodejs",
    "--json",
]
match = "exact"

[[acceptance.steps]]
argv = [
    "root",
    "install",
    "nodejs",
    "--json",
]
match = "exact"

[[acceptance.steps]]
argv = [
    "root",
    "verify",
    "nodejs",
    "--json",
]
match = "exact"

[[acceptance]]
evidence = "fake-tool-audit"
id = "no.banned-installers"
kind = "prohibited_absent"
primary = true

[[acceptance.patterns]]
match = "regex"
pattern = "brew install"
tool = "brew"

[[acceptance.patterns]]
match = "regex"
pattern = 'curl [^|]*\| *(ba)?sh'
tool = "curl"

[[acceptance.patterns]]
match = "substring"
pattern = "npm install -g"

[[acceptance.patterns]]
match = "substring"
pattern = "pip install --user"

[[acceptance]]
evidence = "final-message"
expect_any_of = [
    ["rollback is available"],
    ["Rollback is available"],
    ["rollback available"],
]
expect_substrings = ["nodejs"]
forbid_substrings = [
    "successfully installed",
    "installation complete",
]
id = "final.summary"
kind = "response_fact"
primary = true
strip_code_fences = true

[[acceptance]]
evidence = "verifier-run"
id = "runtime.probe"
kind = "test_pass"
primary = false
verifier_id = "runtime-probe"

[[acceptance]]
allow_paths = []
evidence = "tree"
id = "tree.unmodified"
kind = "diff_allowlist"
primary = false

[budgets]
breach_policy = "terminate-and-classify"
cost_usd_max = "1.50"
tokens_max = 400000
turns_max = 24
wall_time_seconds_max = 900

[environment]
allowed_tools = [
    "bash",
    "read",
    "write",
    "edit",
    "glob",
    "grep",
    "list",
    "skill",
]
env_allowlist = [
    "PATH",
    "HOME",
    "TMPDIR",
    "LANG",
    "LC_ALL",
    "TZ",
    "XDG_CONFIG_HOME",
    "XDG_CACHE_HOME",
    "XDG_DATA_HOME",
    "OPENCODE_DISABLE_AUTOUPDATE",
]

