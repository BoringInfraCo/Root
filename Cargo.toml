[workspace]
members = [
    "crates/root-cli",
    "crates/root-core",
    "crates/root-nix",
    "crates/root-lockfile",
    "crates/root-snapshot",
    "crates/root-doctor",
    "crates/root-verify",
    "crates/root-agent",
    "crates/root-agent-bundle",
    "crates/root-sandbox",
    "crates/root-work",
    "crates/root-continuity",
    "crates/root-mcp",
    "crates/root-adapters"
